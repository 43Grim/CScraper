name: Build and release
 
# Push a tag like v0.5.3 and this builds Windows, macOS and Linux apps on GitHub's
# machines, then publishes a GitHub Release with all three attached.
# "Run workflow" on the Actions tab builds them without publishing a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
 
permissions:
  contents: write
 
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
          - os: ubuntu-22.04
            name: Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Build
        run: uv run --with pyinstaller pyinstaller --noconfirm --windowed --name "Compass Scraper" --collect-submodules compass_scraper launch_gui.py
      # The Linux build must use the computer's own C++ library. The runner's copy is older
      # than the one on newer distros, and their graphics drivers refuse to load against it,
      # which crashes the sign-in browser.
      - name: Use the system C++ library (Linux)
        if: matrix.name == 'Linux'
        run: rm -f "dist/Compass Scraper/_internal/libstdc++.so.6" "dist/Compass Scraper/_internal/libgcc_s.so.1"
      # Sign the app ad hoc, inside out: every library first, then each framework, then the
      # app itself. "codesign --deep" skips parts of the Qt frameworks, which leaves a broken
      # signature, and macOS then calls the downloaded app "damaged".
      - name: Sign the app (macOS)
        if: matrix.name == 'macOS'
        run: |
          APP="dist/Compass Scraper.app"
          xattr -cr "$APP"
          find "$APP/Contents" -type f -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O"; then
              printf '%s\t%s\n' "$(tr -cd / <<< "$f" | wc -c)" "$f"
            fi
          done | sort -rn | cut -f2- | while IFS= read -r f; do
            codesign --force --sign - "$f" || echo "::warning::Couldn't sign $f"
          done
          find "$APP/Contents" -depth -type d \( -name "*.framework" -o -name "*.app" \) -print0 |
            while IFS= read -r -d '' b; do
              codesign --force --sign - "$b" || echo "::warning::Couldn't sign $b"
            done
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP" ||
            echo "::warning::The macOS app's signature didn't verify, so it may show as damaged"
      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="dev"
          OUT="Compass-Scraper-$VERSION-${{ matrix.name }}"
          case "${{ matrix.name }}" in
            Windows) 7z a "$OUT.zip" "./dist/Compass Scraper" > /dev/null; echo "ASSET=$OUT.zip" >> "$GITHUB_ENV" ;;
            macOS)   ditto -c -k --keepParent "dist/Compass Scraper.app" "$OUT.zip"; echo "ASSET=$OUT.zip" >> "$GITHUB_ENV" ;;
            Linux)   tar -czf "$OUT.tar.gz" -C dist "Compass Scraper"; echo "ASSET=$OUT.tar.gz" >> "$GITHUB_ENV" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
 
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Compass Scraper ${{ github.ref_name }}
          body_path: RELEASE-${{ github.ref_name }}.md
          files: assets/*
 
