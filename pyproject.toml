[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compass-scraper"
version = "0.5.4"
description = "Download Compass Education learning tasks, grades, feedback, rubrics and files into an HTML portfolio."
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "rich>=13", "browser-cookie3>=0.19", "PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
compass-scraper = "compass_scraper.cli:main"
compass-gui = "compass_scraper.gui:main"

[tool.setuptools]
packages = ["compass_scraper"]
